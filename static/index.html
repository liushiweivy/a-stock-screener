<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d1014'/%3E%3Cpath d='M2 11 L6 7 L9 9 L14 4' stroke='%23c9963f' stroke-width='1.6' fill='none'/%3E%3Cpath d='M2 13 L6 9 L9 11 L14 6' stroke='%235fa8a0' stroke-width='1.2' fill='none' opacity='.7'/%3E%3C/svg%3E">
<title>A 股条件筛选 · SCREENER</title>
<style>
  :root {
    --bg: #0d1014;
    --bg-card: #151b24;
    --rule: #26303c;
    --ink: #e6e0d2;
    --ink-dim: #8b93a1;
    --ink-faint: #5a636f;
    --copper: #c9963f;
    --teal: #5fa8a0;
    --up: #d0603f;     /* A 股涨红 */
    --down: #4f9d78;   /* 跌绿 */
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, "Sarasa Mono SC", monospace;
    --sans: ui-sans-serif, "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: var(--sans); font-size: 13px; line-height: 1.6; min-height: 100vh; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px 50px; }

  header.masthead {
    border-bottom: 1px solid var(--rule); padding: 15px 0 13px; margin-bottom: 16px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; color: var(--ink-dim);
    flex-wrap: wrap;
  }
  .brand { color: var(--copper); font-weight: 700; font-size: 13px; }
  .brand span { color: var(--ink-faint); font-weight: 400; }
  .hud { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  #countdown { color: var(--teal); min-width: 44px; display: inline-block; }
  button.act {
    background: none; border: 1px solid #3a4654; color: var(--ink-dim);
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
    padding: 5px 11px; cursor: pointer; transition: all .15s ease;
  }
  button.act:hover { border-color: var(--copper); color: var(--copper); }
  button.act:disabled { opacity: .45; cursor: wait; }

  .banner { display: none; border: 1px solid var(--up); padding: 9px 15px;
    margin-bottom: 14px; color: var(--up); font-size: 12.5px; }
  .banner.show { display: block; }
  .banner.ok { border-color: var(--teal); color: var(--teal); }

  .cfgbar {
    display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
    margin-bottom: 14px; font-family: var(--mono); font-size: 11px;
  }
  .cfgbar .cfg-name { color: var(--ink-faint); letter-spacing: .05em; }
  .chip { border: 1px solid #2e3a47; color: var(--ink-dim); padding: 2px 9px;
    letter-spacing: .06em; white-space: nowrap; }
  .chip b { color: var(--copper); font-weight: 400; }

  .tablewrap { border: 1px solid var(--rule); background: var(--bg-card); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono);
    font-size: 12px; min-width: 1260px; }
  thead th {
    text-align: right; color: var(--ink-faint); font-weight: 400; letter-spacing: .1em;
    padding: 9px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap;
    position: sticky; top: 0; background: var(--bg-card);
  }
  thead th.left, td.left { text-align: left; }
  tbody tr { border-bottom: 1px solid #1c242e; }
  tbody tr:hover { background: #18202b; }
  tbody tr.hit { background: rgba(201, 150, 63, .07); }
  tbody tr.hit td:first-child { box-shadow: inset 2px 0 0 var(--copper); }
  tbody tr.hit:hover { background: rgba(201, 150, 63, .11); }
  td { padding: 7px 10px; text-align: right; white-space: nowrap; }
  td.code { color: var(--ink-faint); }
  td.name { font-family: var(--sans); color: var(--ink); }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .tag-gold { color: var(--copper); border: 1px solid #7c5c28; padding: 0 6px;
    font-size: 10.5px; letter-spacing: .08em; margin-right: 6px; }
  .reasons { font-family: var(--sans); font-size: 11px; color: var(--copper);
    white-space: normal; min-width: 240px; line-height: 1.5; }
  .failed { font-family: var(--sans); font-size: 11px; color: var(--ink-faint);
    white-space: normal; min-width: 220px; line-height: 1.5; }
  .na { color: var(--ink-faint); }

  footer { margin-top: 18px; font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-faint); letter-spacing: .08em; }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand">▲ A-SCREENER <span>/ 热度池 MACD · 换手 · 量能</span></div>
    <div class="hud">
      <span>股票池 <b id="universe">—</b></span>
      <span id="snapshot-time">未同步</span>
      <span>下次同步 <span id="countdown">--:--</span></span>
      <button class="act" id="btn-snap">同步行情</button>
      <button class="act" id="btn-kline">更新日K+MACD</button>
    </div>
  </header>

  <div class="banner" id="banner"></div>
  <div class="cfgbar" id="cfgbar"><span class="cfg-name">读取条件配置中…</span></div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th class="left">代码</th><th class="left">名称</th>
          <th>现价</th><th>涨跌%</th><th>换手%</th><th>量比</th><th>成交额(亿)</th>
          <th>量/MA5</th><th>DIF</th><th>DEA</th><th>HIST</th>
          <th class="left">条件命中 / 未达</th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="13" class="na" style="text-align:center;padding:30px">
        正在读取本地数据库…（首次使用请先点「同步行情」再点「更新日K+MACD」）
      </td></tr></tbody>
    </table>
  </div>

  <footer>数据源：新浪财经行情排行 + 腾讯证券日K（免费公开接口，仅供学习）· 每交易日 9:35–15:05 每半小时同步 · 仅本机访问</footer>
</div>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var rowsEl = $("#rows"), bannerEl = $("#banner"), cfgbarEl = $("#cfgbar"),
      universeEl = $("#universe"), snapTimeEl = $("#snapshot-time"),
      countdownEl = $("#countdown"),
      btnSnap = $("#btn-snap"), btnKline = $("#btn-kline");
  var healthTimer = null, nextSyncAt = null, quotesTimer = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmt(v, digits) {
    if (v == null || v === "") return '<span class="na">—</span>';
    return Number(v).toFixed(digits == null ? 2 : digits);
  }
  function updown(v, digits) {
    if (v == null) return '<span class="na">—</span>';
    var cls = v > 0 ? "up" : v < 0 ? "down" : "";
    return '<span class="' + cls + '">' + Number(v).toFixed(digits == null ? 2 : digits) + "</span>";
  }
  function showBanner(msg, ok) {
    if (!msg) { bannerEl.className = "banner"; bannerEl.innerHTML = ""; return; }
    bannerEl.className = "banner show" + (ok ? " ok" : "");
    bannerEl.textContent = msg;
  }

  function cfgChips(cfg) {
    var parts = ['<span class="cfg-name">' + esc(cfg.name || "当前条件") + "</span>"];
    function chip(label) { parts.push('<span class="chip">' + label + "</span>"); }
    function rng(prefix, r, suffix) {
      if (!r) return;
      var t = prefix + " ";
      if (r.min != null && r.max != null) t += "[" + esc(r.min) + ", " + esc(r.max) + "]";
      else if (r.min != null) t += "≥ <b>" + esc(r.min) + "</b>";
      else t += "≤ <b>" + esc(r.max) + "</b>";
      if (suffix) t += " " + suffix;
      chip(t);
    }
    if (cfg.macd) {
      var m = cfg.macd, t = "MACD ";
      if (m.golden_cross_within) t += "<b>" + esc(m.golden_cross_within) + "日内金叉</b> ";
      if (m.hist_gt0) t += "HIST&gt;0 ";
      if (m.dif_gt0) t += "DIF&gt;0 ";
      rng("DIF", m.dif, ""); rng("DEA", m.dea, ""); rng("HIST", m.hist, "");
      chip(t);
    }
    rng("换手", cfg.turnover_rate, "%");
    rng("涨跌", cfg.pct, "%");
    rng("成交额", cfg.amount_yi, "亿");
    rng("量比", cfg.volume_ratio, "");
    rng("量/MA5", cfg.vol_vs_ma5, "倍");
    rng("现价", cfg.price, "");
    cfgbarEl.innerHTML = parts.join("");
  }

  function goldenNow(series, within) {
    // 与后端 golden_cross 语义一致：只看配置的 within 窗口，且当前仍在 0 轴上
    if (!within || !series || series.length < 2) return false;
    var tail = series.slice(-(within + 1));
    for (var k = 1; k < tail.length; k++) {
      if (tail[k - 1][2] <= 0 && tail[k][2] > 0 && series[series.length - 1][2] > 0) return true;
    }
    return false;
  }

  function render(data) {
    cfgChips(data.config || {});
    // 只在配置出错时覆盖横幅；手动同步结果横幅不被定时刷新清掉
    if (data.config_error) {
      showBanner("条件配置文件有误（已显示原始数据）：" + data.config_error);
    }
    if (!data.quotes.length) return;

    var within = data.config && data.config.macd ? data.config.macd.golden_cross_within : null;
    var html = data.quotes.map(function (q) {
      var ind = data.indicators[q.symbol] || {};
      var mt = data.matches[q.symbol] || {};
      var hit = !!mt.matched;
      var ratio5 = null;
      if (ind.vol_ma5) ratio5 = q.volume / (ind.vol_ma5 * 100);
      var gold = goldenNow(ind.hist_series, within);
      var histCls = ind.hist > 0 ? "up" : ind.hist < 0 ? "down" : "";
      var condCell = hit
        ? '<div class="reasons">' + (mt.reasons || []).map(esc).join("；") + "</div>"
        : '<div class="failed">' + ((mt.failed || []).map(esc).join(" · ")) + "</div>";
      return '<tr class="' + (hit ? "hit" : "") + '">' +
        "<td>" + (q.rank || "") + "</td>" +
        '<td class="left code">' + esc(q.symbol.toUpperCase()) + "</td>" +
        '<td class="left name">' + esc(q.name) +
          (gold ? '<span class="tag-gold">金叉</span>' : "") + "</td>" +
        "<td>" + fmt(q.price) + "</td>" +
        "<td>" + updown(q.pct) + "</td>" +
        "<td>" + fmt(q.turnover_rate) + "</td>" +
        "<td>" + fmt(q.volume_ratio) + "</td>" +
        "<td>" + fmt(q.amount / 1e8, 2) + "</td>" +
        "<td>" + (ratio5 == null ? '<span class="na">—</span>' : fmt(ratio5, 2) + "x") + "</td>" +
        "<td>" + fmt(ind.dif, 3) + "</td>" +
        "<td>" + fmt(ind.dea, 3) + "</td>" +
        '<td class="' + histCls + '">' + fmt(ind.hist, 3) + "</td>" +
        '<td class="left">' + condCell + "</td></tr>";
    }).join("");
    rowsEl.innerHTML = html;
  }

  function loadQuotes() {
    fetch("/api/quotes").then(function (r) { return r.json(); })
      .then(render)
      .catch(function (e) { showBanner("读取失败：" + e.message); });
  }

  function refreshHealth() {
    return fetch("/api/health").then(function (r) { return r.json(); })
      .then(function (h) {
        universeEl.textContent = h.universe_size || 0;
        snapTimeEl.textContent = h.latest_snapshot
          ? "快照 " + h.latest_snapshot.replace("T", " ").slice(5, 16) : "未同步";
        nextSyncAt = h.next_snapshot ? new Date(h.next_snapshot) : null;
        var busy = !!h.sync_running;
        btnSnap.disabled = busy; btnKline.disabled = busy;
        if (busy) showBanner("正在执行 " + h.sync_running + " 同步，大约需要几十秒…", true);
      })
      .catch(function () {});
  }

  function pad2(x) { return String(x).padStart(2, "0"); }
  function tick() {
    if (!nextSyncAt) { countdownEl.textContent = "--:--"; return; }
    var s = Math.ceil(Math.max(0, nextSyncAt - new Date()) / 1000);
    var h = Math.floor(s / 3600);
    countdownEl.textContent = h > 0
      ? h + ":" + pad2(Math.floor(s % 3600 / 60)) + ":" + pad2(s % 60)
      : Math.floor(s / 60) + ":" + pad2(s % 60);
  }

  function manualSync(kind, btn) {
    btn.disabled = true;
    showBanner("已触发" + (kind === "snapshot" ? "行情" : "日K+MACD") + "同步…", true);
    fetch("/api/sync?kind=" + kind, { method: "POST" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.ok) showBanner("同步完成：" + (d.detail || d.status || ""), true);
        else showBanner("同步失败：" + (d.error || d.detail || "未知错误"));
      })
      .catch(function (e) { showBanner("同步请求失败：" + e.message); })
      .finally(function () {
        btn.disabled = false;
        refreshHealth().then(loadQuotes);
      });
  }

  btnSnap.addEventListener("click", function () { manualSync("snapshot", btnSnap); });
  btnKline.addEventListener("click", function () { manualSync("klines", btnKline); });

  refreshHealth().then(loadQuotes);
  healthTimer = setInterval(refreshHealth, 30000);
  quotesTimer = setInterval(loadQuotes, 300000);
  setInterval(tick, 1000);
  tick();
})();
</script>
</body>
</html>
